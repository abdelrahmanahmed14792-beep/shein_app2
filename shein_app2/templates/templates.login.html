<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - الأدمن</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 450px;">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4 text-primary">دخول لوحة الأدمن</h4>

                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} py-2">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">كلمة السر:</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="أدخل كلمة السر">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">دخول</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
